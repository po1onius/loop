# Local S3 storage overlay. Set COMPOSE_FILE=compose.yaml to use externally managed S3.
services:
  api-svc:
    environment:
      LOOP_S3_ENDPOINT_URL: ${LOOP_S3_INTERNAL_ENDPOINT_URL-http://seaweedfs:8333}
    depends_on:
      s3-init:
        condition: service_completed_successfully

  seaweedfs:
    container_name: loop-seaweedfs
    image: docker.io/chrislusf/seaweedfs:4.47
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.autoCreateBucket=false
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${LOOP_S3_ACCESS_KEY_ID:?missing LOOP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${LOOP_S3_SECRET_ACCESS_KEY:?missing LOOP_S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${LOOP_S3_BUCKET:?missing LOOP_S3_BUCKET}
    volumes:
      - loop-seaweedfs-data:/data
    ports:
      - "${LOOP_S3_API_PORT:-9000}:8333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    container_name: loop-s3-init
    image: docker.io/amazon/aws-cli:2.37.4
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/loop/s3/init.sh"]
    environment:
      AWS_ENDPOINT_URL: http://seaweedfs:8333
      AWS_DEFAULT_REGION: ${LOOP_S3_REGION:?missing LOOP_S3_REGION}
      AWS_ACCESS_KEY_ID: ${LOOP_S3_ACCESS_KEY_ID:?missing LOOP_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${LOOP_S3_SECRET_ACCESS_KEY:?missing LOOP_S3_SECRET_ACCESS_KEY}
      LOOP_S3_BUCKET: ${LOOP_S3_BUCKET:?missing LOOP_S3_BUCKET}
    volumes:
      - ../s3:/etc/loop/s3:ro

volumes:
  loop-seaweedfs-data:
