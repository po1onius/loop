access_ttl = 900
refresh_ttl = 2592000

[perm]
perm_ver = 1

[perm.role_perm]
user = ["event.read", "event.join", "event.create", "media.upload", "community.post.create"]
organizer = ["event.read", "event.join", "event.create", "event.update_own", "media.upload"]
admin = ["*"]

[email]
from = "Loop <verify.kit.xin@qq.com>"

[email.smtp]
sender = "verify.kit.xin@qq.com"
domain = "smtp.qq.com"

[storage]
bucket = "loop-local"
region = "us-east-1"
endpoint_url = "http://192.168.0.102:9000"
public_base_url = "http://192.168.0.102:9000/loop-local"
key_prefix = "media"
force_path_style = true
presign_expires_secs = 900
max_upload_bytes = 10485760
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/gif"]
