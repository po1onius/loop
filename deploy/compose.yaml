services:
  db:
    container_name: pgsql
    image: docker.io/postgres
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: wdnmd
      POSTGRES_DB: loop
      POSTGRES_USER: srus
    volumes:
      - loop-pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5132:5432"

  cache:
    container_name: redis
    image: docker.io/redis
    volumes:
      - loop-redis-data:/data
    ports:
      - "6319:6379"

  nacos:
    image: qingpan/rnacos
    container_name: rnacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    volumes:
      - rnacos-data:/io

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: loop-otel-collector
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    # Do not use grafana/tempo:latest here: Docker Hub's latest tag can track
    # main branch builds and may reject the stable 2.x config schema below.
    image: docker.io/grafana/tempo:2.10.5
    container_name: loop-tempo
    # Podman rootless without /etc/subuid maps mounted volumes to the host user.
    # Run Tempo as container root so the local named volume is writable.
    user: "0"
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - loop-tempo-data:/tmp/tempo
    ports:
      - "3200:3200"

  loki:
    image: docker.io/grafana/loki:3.7.0
    container_name: loop-loki
    command:
      - -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loop-loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: docker.io/grafana/alloy:v1.16.1
    container_name: loop-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ../srv/log:/var/log/loop:ro
      - loop-alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: loop-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: loop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - loop-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  loop-pgdata:
  loop-redis-data:
  rnacos-data:
  loop-tempo-data:
  loop-loki-data:
  loop-alloy-data:
  loop-grafana-data:
