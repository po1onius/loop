# Use postgres/example user/password credentials

services:
  db:
    container_name: pgsql
    image: docker.io/postgres
    # restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: wdnmd
      POSTGRES_DB: loop
      POSTGRES_USER: srus
    volumes:
      - loop-pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5132:5432"

  cache:
    container_name: redis
    image: docker.io/redis
    volumes:
      - loop-redis-data:/data
    ports:
      - "6319:6379"

  nacos:
    image: qingpan/rnacos
    container_name: rnacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    volumes:
      - rnacos-data:/io

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: loop-otel-collector
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: docker.io/grafana/tempo:latest
    container_name: loop-tempo
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - loop-tempo-data:/tmp/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: loop-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: docker.io/grafana/grafana-oss:latest
    container_name: loop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - loop-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  loop-pgdata:
  loop-redis-data:
  rnacos-data:
  loop-tempo-data:
  loop-grafana-data:
