apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-worker-svc
  labels:
    app.kubernetes.io/name: loop-worker-svc
    app.kubernetes.io/part-of: loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loop-worker-svc
      app.kubernetes.io/part-of: loop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loop-worker-svc
        app.kubernetes.io/part-of: loop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loop-worker-svc
          image: loop-worker-svc
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: loop-env
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/loop/firebase/service-account.json
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: RABBITMQ_URL
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: MEILI_MASTER_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: firebase
              mountPath: /etc/loop/firebase
              readOnly: true
            - name: logs
              mountPath: /app/log
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: firebase
          secret:
            secretName: loop-firebase
            optional: true
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
