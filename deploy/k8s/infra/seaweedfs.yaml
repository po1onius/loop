apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: loop
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: loop
  ports:
    - name: s3
      port: 8333
      targetPort: s3
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: loop
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/part-of: loop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/part-of: loop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.47
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -s3.port=8333
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -s3.allowDeleteBucketNotEmpty=false
            - -s3.autoCreateBucket=false
            - -webdav=false
            - -admin.ui=false
            - -master.telemetry=false
          ports:
            - name: s3
              containerPort: 8333
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: LOOP_S3_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: LOOP_S3_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
