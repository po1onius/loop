apiVersion: v1
kind: Service
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: loop
spec:
  selector:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: loop
  ports:
    - name: http
      port: 7700
      targetPort: http
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: loop
spec:
  serviceName: search
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search
      app.kubernetes.io/part-of: loop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: loop
    spec:
      automountServiceAccountToken: false
      containers:
        - name: meilisearch
          image: docker.io/getmeili/meilisearch:v1.54.0
          ports:
            - name: http
              containerPort: 7700
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: 'true'
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: loop-secrets
                  key: MEILI_MASTER_KEY
            - name: MEILI_MAX_INDEXING_MEMORY
              value: 512MiB
            - name: MEILI_MAX_INDEXING_THREADS
              value: '1'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
