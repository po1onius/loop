[workspace]
members = [
    "loop-infra",
    "loop-event-svc",
    "loop-im-svc",
    "loop-community-svc",
    "loop-svc-model"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
tokio = { version = "*", features = ["full"] }
jsonwebtoken = { version = "*", features = ["aws_lc_rs"] }
diesel = { version = "*", features = ["uuid", "chrono", "ipnet-address"] }
diesel-async = { version = "*", features = ["postgres", "deadpool"] }
anyhow = { version = "*" }
uuid = { version = "*", features = ["v7", "serde"] }
thiserror = { version = "*" }
deadpool = { version = "*" }
serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }
bcrypt = "*"
tracing = { version = "*" }
axum = { version = "*", features = ["macros"] }
toml = { version = "*" }
tracing-subscriber = { version = "*", features = ["env-filter", "json"] }
tracing-appender = { version = "*" }
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.30", features = ["trace"] }
tracing-opentelemetry = "0.31"
redis = "*"
deadpool-redis = "*"
rand = { version = "*", features = ["thread_rng"] }
lettre = { version = "*", default-features = false, features = ["rustls-tls", "builder", "smtp-transport", "tokio1", "tokio1-rustls"] }
http = "*"
tower-http = { version = "*", features = ["cors", "request-id", "trace"] }
sha2 = "*"
hex = "*"
futures-util = "*"
dashmap = "*"
tokio-stream = "*"
tower-cookies = "*"
loop-svc-model = { path = "loop-svc-model" }
loop-infra = { path = "loop-infra" }
time = "*"
loop-dto = { path = "../loop-dto" }
base64 = "*"
chrono = { version = "*", features = ["serde"] }
ipnet = "*"
paste = "*"
tera = "*"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
